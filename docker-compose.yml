x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: posmaster-api:latest
  restart: unless-stopped
  environment: &app-environment
    APP_NAME: ${APP_NAME:-POSMaster}
    APP_ENV: ${APP_ENV:-production}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_KEY: ${APP_KEY:?Set APP_KEY in .env or the shell environment}
    APP_URL: ${APP_URL:-http://localhost:8000}
    APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Phnom_Penh}
    LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
    LOG_LEVEL: ${LOG_LEVEL:-warning}
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-inventory_system}
    DB_USERNAME: ${DB_USERNAME:-posmaster}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    CACHE_STORE: ${CACHE_STORE:-redis}
    CACHE_DRIVER: ${CACHE_STORE:-redis}
    QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
    SESSION_DRIVER: ${SESSION_DRIVER:-redis}
    REDIS_CLIENT: predis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    BROADCAST_CONNECTION: reverb
    REVERB_APP_ID: ${REVERB_APP_ID:-posmaster}
    REVERB_APP_KEY: ${REVERB_APP_KEY:-posmaster-key}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:-posmaster-secret}
    REVERB_HOST: ${REVERB_HOST:-localhost}
    REVERB_PORT: ${REVERB_PORT:-8080}
    REVERB_SCHEME: ${REVERB_SCHEME:-http}
    SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8000}
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "1"
    volumes:
      - storage:/var/www/storage

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/public:ro
    depends_on:
      - app

  queue:
    <<: *app
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - storage:/var/www/storage

  scheduler:
    <<: *app
    command: php artisan schedule:work
    volumes:
      - storage:/var/www/storage

  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_PORT:-8080}:8080"
    volumes:
      - storage:/var/www/storage

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-inventory_system}
      MYSQL_USER: ${DB_USERNAME:-posmaster}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-secret}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-root-secret}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  storage:
